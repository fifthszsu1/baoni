services:
  # MySQL数据库 - 英语读后续写打分系统
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: baoni-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-BaoniRoot@2025}
      MYSQL_DATABASE: baoni_scoring_db
      MYSQL_USER: baoni_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-baoni_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/config:/etc/mysql/conf.d
    command: --authentication-policy=mysql_native_password
    networks:
      - baoni-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: baoni-backend-prod
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - DATABASE_URL=mysql+pymysql://baoni_user:${MYSQL_PASSWORD:-baoni_password}@mysql:3306/baoni_scoring_db?charset=utf8mb4
      - SECRET_KEY=${SECRET_KEY:-your-production-secret-key}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_DEPLOYMENT_NAME=${AZURE_DEPLOYMENT_NAME}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - baoni-network
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: baoni-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl  # SSL证书目录
      - ./uploads:/usr/share/nginx/uploads  # 静态文件访问
    networks:
      - baoni-network
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/mysql

networks:
  baoni-network:
    driver: bridge 